<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý thư viện</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1f2a2e;--mu:#6b7780;--bd:#e3dfd6;--pr:#1d5c63;--prt:#e0eeef;--wa:#b4531a;--er:#b3261e;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--sf:#1b2426;--tx:#e8eeee;--mu:#94a3a6;--bd:#2d3a3d;--pr:#5fb8c0;--prt:#1f3336;--wa:#e69a64;--er:#f2837b;--ok:#6fcf97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121819;--sf:#1b2426;--tx:#e8eeee;--mu:#94a3a6;--bd:#2d3a3d;--pr:#5fb8c0;--prt:#1f3336;--wa:#e69a64;--er:#f2837b;--ok:#6fcf97;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
nav{width:236px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{font-weight:700;font-size:17px;color:var(--pr);padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
nav button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--prt);color:var(--pr);font-weight:600}
main{flex:1;min-width:0;padding:26px 30px;max-width:1200px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.stat b{display:block;font-size:26px;margin-top:2px}.stat span{color:var(--mu);font-size:13px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:-1px}
.btn{border:0;background:var(--pr);color:#fff;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;font-weight:600}
:root:not([data-theme="light"]) .btn{color:#0b1a1c}.btn.g{background:var(--prt);color:var(--pr)}.btn.d{background:none;color:var(--er);padding:6px 8px}.btn.s{padding:5px 10px;font-size:13px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);font-weight:600}tr:last-child td{border:0}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--prt);color:var(--pr)}.tag.w{background:#f7e3d3;color:var(--wa)}.tag.e{background:#f8dcd9;color:var(--er)}.tag.o{background:#d9efe2;color:var(--ok)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.row i{display:block;height:10px;background:var(--pr);border-radius:5px;min-width:4px}.row em{width:120px;font-style:normal;flex:none;overflow:hidden;text-overflow:ellipsis}
.md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md form{background:var(--sf);border-radius:14px;padding:22px;width:420px;max-width:100%;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--mu)}.empty{padding:28px;text-align:center;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:8px;border:0;border-bottom:1px solid var(--bd)}.brand{display:none}nav button{width:auto;white-space:nowrap}main{padding:18px 14px}.two{grid-template-columns:1fr}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const D=864e5,td=()=>new Date().toISOString().slice(0,10),add=(d,n)=>new Date(+new Date(d)+n*D).toISOString().slice(0,10),
diff=(a,b)=>Math.round((new Date(a)-new Date(b))/D),vnd=n=>(n||0).toLocaleString('vi-VN')+' đ',
fd=d=>d?d.split('-').reverse().join('/'):'—';
const seed=()=>({cfg:{days:14,fine:5000},
books:[['B001','Đắc nhân tâm','Dale Carnegie','Kỹ năng',5],['B002','Nhà giả kim','Paulo Coelho','Văn học',4],['B003','Sapiens','Yuval Noah Harari','Lịch sử',3],['B004','Clean Code','Robert C. Martin','Công nghệ',2],['B005','Dế Mèn phiêu lưu ký','Tô Hoài','Thiếu nhi',6],['B006','Tư duy nhanh và chậm','Daniel Kahneman','Tâm lý',3]].map(a=>({id:a[0],name:a[1],author:a[2],cat:a[3],qty:a[4]})),
readers:[['R001','Nguyễn Văn An','0901234567','Quận 1, TP.HCM'],['R002','Trần Thị Bình','0912345678','Quận 3, TP.HCM'],['R003','Lê Minh Châu','0987654321','Thủ Đức, TP.HCM'],['R004','Phạm Quốc Dũng','0933222111','Bình Thạnh, TP.HCM']].map(a=>({id:a[0],name:a[1],phone:a[2],addr:a[3]})),
loans:[['P001','R001','B001',-20,null],['P002','R002','B004',-5,null],['P003','R003','B002',-30,-18],['P004','R004','B003',-3,null]].map(a=>({id:a[0],reader:a[1],book:a[2],borrow:add(td(),a[3]),due:add(add(td(),a[3]),14),ret:a[4]==null?null:add(td(),a[4])}))});
let S;try{S=JSON.parse(localStorage.getItem('lib'))}catch(e){}S=S||seed();
const H=s=>{let h=5381;for(const c of 'lib$'+s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const seedU=()=>[{u:'admin',pw:H('admin123'),name:'Quản trị viên',role:'admin'},{u:'thuthu',pw:H('thuthu123'),name:'Thủ thư Mai',role:'librarian'}];
if(!S.users)S.users=seedU();
let ME=S.users.find(x=>x.u==(()=>{try{return localStorage.getItem('libme')}catch(e){}})())||null,tab='in';
const save=()=>{try{localStorage.setItem('lib',JSON.stringify(S))}catch(e){}};
let view='dash',q='',lf='all';
const V=[['dash','🏠','Tổng quan'],['books','📚','Quản lý sách'],['readers','👥','Quản lý độc giả'],['borrow','📝','Lập phiếu mượn'],['ret','↩️','Lập phiếu trả'],['loans','🧾','Lịch sử phiếu'],['active','📖','Sách đang mượn'],['over','⏰','Quá hạn & phạt'],['rep','📊','Thống kê báo cáo'],['set','⚙️','Cài đặt'],['users','🔑','Tài khoản'],['mine','🙋','Sách của tôi']];
const ROLE={admin:'Quản trị',librarian:'Thủ thư',reader:'Độc giả'};
const P={admin:['dash','books','readers','borrow','ret','loans','active','over','rep','set','users','edit'],librarian:['dash','books','readers','borrow','ret','loans','active','over','rep','edit'],reader:['mine','books']};
const can=k=>ME&&P[ME.role].includes(k);
const bk=id=>S.books.find(b=>b.id==id)||{name:'(đã xóa)'},rd=id=>S.readers.find(r=>r.id==id)||{name:'(đã xóa)'};
const out=b=>S.loans.filter(l=>l.book==b&&!l.ret).length,avail=b=>b.qty-out(b.id);
const late=l=>Math.max(0,diff(l.ret||td(),l.due)),fine=l=>late(l)*S.cfg.fine;
const act=()=>S.loans.filter(l=>!l.ret),ovr=()=>act().filter(l=>late(l)>0);
const nid=(p,a)=>p+String(Math.max(0,...a.map(x=>+x.id.slice(1)))+1).padStart(3,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=s=>q?s.toLowerCase().includes(q.toLowerCase()):true;
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.join(''):`<tr><td colspan="${h.length}" class="empty">Không có dữ liệu</td></tr>`}</table></div>`;
const st=l=>l.ret?'<span class="tag o">Đã trả</span>':late(l)>0?`<span class="tag e">Quá ${late(l)} ngày</span>`:'<span class="tag">Đang mượn</span>';
const srch=ph=>`<input placeholder="${ph}" value="${esc(q)}" oninput="q=this.value;go(view,1)" style="flex:1;min-width:200px">`;
function go(v,keep){if(!keep){q='';lf='all'}view=v;draw();if(keep){const i=document.querySelector('main input');if(i){i.focus();i.setSelectionRange(99,99)}}}
function draw0(){document.getElementById('nav').innerHTML='<div class="brand">📚 Thư viện số</div>'+V.filter(v=>can(v[0])).map(v=>`<button class="${v[0]==view?'on':''}" onclick="go('${v[0]}')"><span>${v[1]}</span>${v[2]}</button>`).join('');
document.getElementById('app').innerHTML=R[view]()}
function modal(t,fs,val,ok){const d=document.createElement('div');d.className='md';
d.innerHTML=`<form><h1 style="font-size:18px">${t}</h1>${fs.map(f=>`<label>${f[1]}${f[2]=='select'?`<select name="${f[0]}">${f[3].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]||'text'}" ${f[2]=='number'?'min="1"':''} required value="${esc(val[f[0]])}">`}</label>`).join('')}<div class="bar" style="justify-content:flex-end;margin:0"><button type="button" class="btn g" id="x">Hủy</button><button class="btn">Lưu</button></div></form>`;
document.body.append(d);d.querySelector('#x').onclick=()=>d.remove();
d.querySelector('form').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(ok(o)!==false){d.remove();save();draw()}}}
const bf=[['name','Tên sách'],['author','Tác giả'],['cat','Thể loại'],['qty','Số lượng','number']];
const rf=[['name','Họ và tên'],['phone','Số điện thoại','tel'],['addr','Địa chỉ']];
function editB(id){const b=S.books.find(x=>x.id==id)||{};modal(id?'Sửa sách':'Thêm sách',bf,b,o=>{o.qty=+o.qty;if(id){if(o.qty<out(id)){alert('Số lượng nhỏ hơn số sách đang cho mượn ('+out(id)+')');return false}Object.assign(b,o)}else S.books.push({id:nid('B',S.books),...o})})}
function editR(id){const r=S.readers.find(x=>x.id==id)||{};modal(id?'Sửa độc giả':'Thêm độc giả',rf,r,o=>{id?Object.assign(r,o):S.readers.push({id:nid('R',S.readers),...o})})}
function delB(id){if(out(id))return alert('Sách đang được mượn, không thể xóa.');if(confirm('Xóa sách này?')){S.books=S.books.filter(b=>b.id!=id);save();draw()}}
function delR(id){if(act().some(l=>l.reader==id))return alert('Độc giả còn sách chưa trả.');if(confirm('Xóa độc giả này?')){S.readers=S.readers.filter(r=>r.id!=id);save();draw()}}
function doBorrow(e){e.preventDefault();const f=new FormData(e.target),b=f.get('book');if(avail(bk(b))<1)return alert('Sách đã hết.');
const bd=f.get('borrow');S.loans.push({id:nid('P',S.loans),reader:f.get('reader'),book:b,borrow:bd,due:add(bd,+f.get('days')),ret:null});save();alert('Đã lập phiếu mượn. Số lượng sách còn lại được cập nhật.');go('active')}
function doRet(id){const l=S.loans.find(x=>x.id==id);l.ret=td();const f=fine(l);save();alert(f?'Đã trả sách. Tiền phạt: '+vnd(f):'Đã trả sách đúng hạn.');draw()}
const bars=(a,fmt=x=>x)=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="row"><em title="${esc(x[0])}">${esc(x[0])}</em><i style="width:${x[1]/mx*60}%"></i><b>${fmt(x[1])}</b></div>`).join('')||'<div class="empty">Chưa có dữ liệu</div>'};
const cnt=(arr,k)=>Object.entries(arr.reduce((o,x)=>(o[k(x)]=(o[k(x)]||0)+1,o),{})).sort((a,b)=>b[1]-a[1]);
const loanRow=(l,x='')=>`<tr><td>${l.id}</td><td>${esc(rd(l.reader).name)}</td><td>${esc(bk(l.book).name)}</td><td>${fd(l.borrow)}</td><td>${fd(l.due)}</td><td>${fd(l.ret)}</td><td>${st(l)}</td>${x}</tr>`;
const LH=['Mã phiếu','Độc giả','Sách','Ngày mượn','Hạn trả','Ngày trả','Trạng thái'];
const R={
dash:()=>{const tf=S.loans.reduce((s,l)=>s+fine(l),0);return `<h1>Tổng quan</h1><p class="sub">Hôm nay, ${fd(td())}</p>
<div class="grid">${[['Đầu sách',S.books.length],['Tổng số bản',S.books.reduce((s,b)=>s+b.qty,0)],['Độc giả',S.readers.length],['Đang mượn',act().length],['Quá hạn',ovr().length],['Tiền phạt',vnd(tf)]].map(c=>`<div class="card stat"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
<div class="two"><div><h1 style="font-size:16px">Phiếu gần đây</h1>${tbl(['Mã','Độc giả','Sách','Trạng thái'],S.loans.slice(-5).reverse().map(l=>`<tr><td>${l.id}</td><td>${esc(rd(l.reader).name)}</td><td>${esc(bk(l.book).name)}</td><td>${st(l)}</td></tr>`))}</div>
<div class="card"><h1 style="font-size:16px">Sách theo thể loại</h1>${bars(cnt(S.books,b=>b.cat))}</div></div>`},
books:()=>`<h1>Quản lý sách</h1><p class="sub">Thêm, sửa, xóa và tìm kiếm sách</p><div class="bar">${srch('Tìm theo mã, tên, tác giả, thể loại...')}${can('edit')?'<button class="btn" onclick="editB()">+ Thêm sách</button>':''}</div>`+
tbl(['Mã','Tên sách','Tác giả','Thể loại','Tổng','Còn lại',''],S.books.filter(b=>m([b.id,b.name,b.author,b.cat].join(' '))).map(b=>`<tr><td>${b.id}</td><td><b>${esc(b.name)}</b></td><td>${esc(b.author)}</td><td><span class="tag">${esc(b.cat)}</span></td><td>${b.qty}</td><td>${avail(b)?avail(b):'<span class="tag e">Hết</span>'}</td><td>${can('edit')?`<button class="btn g s" onclick="editB('${b.id}')">Sửa</button> <button class="btn d s" onclick="delB('${b.id}')">Xóa</button>`:''}</td></tr>`)),
readers:()=>`<h1>Quản lý độc giả</h1><p class="sub">Lưu và tra cứu thông tin độc giả</p><div class="bar">${srch('Tra cứu theo mã, tên, số điện thoại...')}<button class="btn" onclick="editR()">+ Thêm độc giả</button></div>`+
tbl(['Mã','Họ tên','Điện thoại','Địa chỉ','Đang mượn',''],S.readers.filter(r=>m([r.id,r.name,r.phone,r.addr].join(' '))).map(r=>`<tr><td>${r.id}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.phone)}</td><td>${esc(r.addr)}</td><td>${act().filter(l=>l.reader==r.id).length}</td><td><button class="btn g s" onclick="editR('${r.id}')">Sửa</button> <button class="btn d s" onclick="delR('${r.id}')">Xóa</button></td></tr>`)),
borrow:()=>`<h1>Lập phiếu mượn</h1><p class="sub">Số lượng sách còn lại sẽ tự động cập nhật</p><form class="card" onsubmit="doBorrow(event)" style="display:grid;gap:14px;max-width:520px">
<label>Độc giả<select name="reader">${S.readers.map(r=>`<option value="${r.id}">${r.id} — ${esc(r.name)}</option>`).join('')}</select></label>
<label>Sách (chỉ hiển thị sách còn)<select name="book">${S.books.filter(b=>avail(b)>0).map(b=>`<option value="${b.id}">${esc(b.name)} (còn ${avail(b)})</option>`).join('')}</select></label>
<div class="two"><label>Ngày mượn<input type="date" name="borrow" value="${td()}" required></label><label>Số ngày được mượn<input type="number" name="days" min="1" value="${S.cfg.days}" required></label></div>
<button class="btn">Lập phiếu mượn</button></form>`,
ret:()=>`<h1>Lập phiếu trả</h1><p class="sub">Ngày trả ghi nhận là hôm nay; tiền phạt tính tự động</p>`+tbl(['Mã','Độc giả','Sách','Hạn trả','Trạng thái','Phạt dự kiến',''],act().map(l=>`<tr><td>${l.id}</td><td>${esc(rd(l.reader).name)}</td><td>${esc(bk(l.book).name)}</td><td>${fd(l.due)}</td><td>${st(l)}</td><td>${vnd(fine(l))}</td><td><button class="btn s" onclick="doRet('${l.id}')">Trả sách</button></td></tr>`)),
loans:()=>`<h1>Lịch sử phiếu mượn – trả</h1><p class="sub">Toàn bộ phiếu đã lập</p><div class="bar">${srch('Tìm theo mã phiếu, độc giả, sách...')}<select onchange="lf=this.value;go('loans',1)">${[['all','Tất cả'],['act','Đang mượn'],['ret','Đã trả']].map(o=>`<option value="${o[0]}" ${lf==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`+
tbl(LH,S.loans.filter(l=>(lf=='all'||(lf=='act')==!l.ret)&&m([l.id,rd(l.reader).name,bk(l.book).name].join(' '))).reverse().map(l=>loanRow(l))),
active:()=>`<h1>Sách đang được mượn</h1><p class="sub">${act().length} phiếu chưa trả</p>`+tbl(LH.slice(0,5).concat(['Còn lại']),act().map(l=>`<tr><td>${l.id}</td><td>${esc(rd(l.reader).name)}</td><td>${esc(bk(l.book).name)}</td><td>${fd(l.borrow)}</td><td>${fd(l.due)}</td><td>${st(l)}</td></tr>`)),
over:()=>{const o=ovr();return `<h1>Sách quá hạn & tiền phạt</h1><p class="sub">Mức phạt: ${vnd(S.cfg.fine)}/ngày/cuốn</p><div class="grid"><div class="card stat"><span>Phiếu quá hạn</span><b>${o.length}</b></div><div class="card stat"><span>Tiền phạt tạm tính</span><b>${vnd(o.reduce((s,l)=>s+fine(l),0))}</b></div></div>`+
tbl(['Mã','Độc giả','SĐT','Sách','Hạn trả','Số ngày trễ','Tiền phạt'],o.map(l=>`<tr><td>${l.id}</td><td>${esc(rd(l.reader).name)}</td><td>${esc(rd(l.reader).phone||'')}</td><td>${esc(bk(l.book).name)}</td><td>${fd(l.due)}</td><td><span class="tag e">${late(l)}</span></td><td><b>${vnd(fine(l))}</b></td></tr>`))},
rep:()=>{const mo=cnt(S.loans,l=>l.borrow.slice(0,7)).sort();return `<h1>Thống kê & báo cáo</h1><p class="sub">Tổng hợp hoạt động thư viện</p><div class="two"><div class="card"><h1 style="font-size:16px">Số bản theo thể loại</h1>${bars(Object.entries(S.books.reduce((o,b)=>(o[b.cat]=(o[b.cat]||0)+b.qty,o),{})).sort((a,b)=>b[1]-a[1]))}</div>
<div class="card"><h1 style="font-size:16px">Sách được mượn nhiều nhất</h1>${bars(cnt(S.loans,l=>bk(l.book).name).slice(0,6))}</div>
<div class="card"><h1 style="font-size:16px">Lượt mượn theo tháng</h1>${bars(mo)}</div>
<div class="card"><h1 style="font-size:16px">Tồn kho</h1>${bars(S.books.map(b=>[b.name,avail(b)]))}</div></div><div class="bar" style="margin-top:16px"><button class="btn g" onclick="exp()">⬇ Xuất dữ liệu JSON</button></div>`},
users:()=>`<h1>Quản lý tài khoản</h1><p class="sub">Phân quyền: Quản trị, Thủ thư, Độc giả</p>`+tbl(['Tên đăng nhập','Họ tên','Vai trò',''],S.users.map(x=>`<tr><td>${esc(x.u)}</td><td>${esc(x.name)}</td><td><select onchange="setRole('${x.u}',this.value)" ${x.u==ME.u?'disabled':''}>${Object.entries(ROLE).map(o=>`<option value="${o[0]}" ${x.role==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td><td>${x.u==ME.u?'':`<button class="btn d s" onclick="delU('${x.u}')">Xóa</button>`}</td></tr>`)),
mine:()=>{const l=S.loans.filter(x=>x.reader==ME.reader);return `<h1>Sách của tôi</h1><p class="sub">Xin chào ${esc(ME.name)} — ${l.filter(x=>!x.ret).length} cuốn đang mượn</p>`+tbl(['Mã phiếu','Sách','Ngày mượn','Hạn trả','Ngày trả','Trạng thái'],l.reverse().map(x=>`<tr><td>${x.id}</td><td>${esc(bk(x.book).name)}</td><td>${fd(x.borrow)}</td><td>${fd(x.due)}</td><td>${fd(x.ret)}</td><td>${st(x)}</td></tr>`))},
set:()=>`<h1>Cài đặt</h1><p class="sub">Quy định mượn – trả</p><form class="card" style="display:grid;gap:14px;max-width:420px" onsubmit="event.preventDefault();S.cfg.days=+this.days.value;S.cfg.fine=+this.fine.value;save();alert('Đã lưu cài đặt');draw()">
<label>Số ngày mượn mặc định<input name="days" type="number" min="1" value="${S.cfg.days}"></label><label>Tiền phạt mỗi ngày trễ (đ)<input name="fine" type="number" min="0" step="500" value="${S.cfg.fine}"></label><button class="btn">Lưu cài đặt</button></form>
<div class="bar" style="margin-top:16px"><button class="btn d" onclick="if(confirm('Khôi phục dữ liệu mẫu?')){S=seed();S.users=seedU();ME=null;save();draw()}">Khôi phục dữ liệu mẫu</button></div>`};
function exp(){const w=window.open('','_blank');if(w){w.document.write('<pre>'+esc(JSON.stringify(S,null,2))+'</pre>')}}
const authUI=()=>`<div class="card" style="margin:6vh auto;width:400px;max-width:100%"><div class="brand" style="padding:0 0 10px;font-size:20px">📚 Thư viện số</div><div class="bar"><button class="btn ${tab=='in'?'':'g'}" style="flex:1" onclick="tab='in';draw()">Đăng nhập</button><button class="btn ${tab=='up'?'':'g'}" style="flex:1" onclick="tab='up';draw()">Đăng ký</button></div><form onsubmit="${tab=='in'?'login':'signup'}(event)" style="display:grid;gap:12px">${tab=='up'?'<label>Họ và tên<input name="name" required></label><label>Số điện thoại<input name="phone" type="tel" required></label><label>Địa chỉ<input name="addr" required></label>':''}<label>Tên đăng nhập<input name="u" required autocomplete="username"></label><label>Mật khẩu<input name="p" type="password" minlength="6" required></label>${tab=='up'?'<label>Nhập lại mật khẩu<input name="p2" type="password" required></label>':''}<button class="btn">${tab=='in'?'Đăng nhập':'Tạo tài khoản độc giả'}</button></form>${tab=='in'?'<p class="sub" style="margin:14px 0 0;font-size:13px">Demo: <b>admin / admin123</b> (quản trị), <b>thuthu / thuthu123</b> (thủ thư)</p>':''}</div>`;
const sess=u=>{ME=u;try{localStorage.setItem('libme',u.u)}catch(x){}};
function login(e){e.preventDefault();const f=new FormData(e.target),u=S.users.find(x=>x.u==f.get('u').trim()&&x.pw==H(f.get('p')));if(!u)return alert('Sai tên đăng nhập hoặc mật khẩu.');sess(u);view=P[u.role][0];draw()}
function signup(e){e.preventDefault();const f=new FormData(e.target),u=f.get('u').trim();if(f.get('p')!=f.get('p2'))return alert('Mật khẩu nhập lại không khớp.');if(S.users.some(x=>x.u==u))return alert('Tên đăng nhập đã tồn tại.');const id=nid('R',S.readers);S.readers.push({id,name:f.get('name'),phone:f.get('phone'),addr:f.get('addr')});const n={u,pw:H(f.get('p')),name:f.get('name'),role:'reader',reader:id};S.users.push(n);save();sess(n);view='mine';draw()}
function logout(){ME=null;try{localStorage.removeItem('libme')}catch(x){}tab='in';draw()}
function setRole(u,r){S.users.find(x=>x.u==u).role=r;save();draw()}
function delU(u){if(confirm('Xóa tài khoản '+u+'?')){S.users=S.users.filter(x=>x.u!=u);save();draw()}}
function draw(){const n=document.getElementById('nav');n.style.display=ME?'':'none';if(!ME){document.getElementById('app').innerHTML=authUI();return}
if(!can(view))view=P[ME.role][0];draw0();n.insertAdjacentHTML('beforeend',`<div style="margin-top:14px;padding:12px;border-top:1px solid var(--bd);font-size:13px"><b>${esc(ME.name)}</b><br><span class="tag">${ROLE[ME.role]}</span><br><button class="btn g s" style="margin-top:10px" onclick="logout()">Đăng xuất</button></div>`)}
draw();
</script></body></html>
